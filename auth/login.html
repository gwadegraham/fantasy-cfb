<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>Sign in — Campus Clash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex">

  <!-- ==========================================================================
       Campus Clash custom login page (Auth0 Classic Universal Login).

       This file is the SOURCE OF TRUTH. The live copy lives in the Auth0
       dashboard under Branding > Universal Login > Login ("Customize Login
       Page"); paste this whole file there after editing. See README.

       It is served from the Auth0 tenant origin, NOT campusclash.io, so:
         - every asset URL must be absolute against https://campusclash.io
         - the design tokens are inlined rather than pulled from /styles.css.
           A render-blocking cross-origin request to the app dyno would stall
           first paint, and styles.css's global `* { color }` would fight this
           page. modules/identity-guard.js takes the same self-contained
           approach for the same reason.
         - webAuth.login() reaches /co/authenticate same-origin, so there is no
           third-party-cookie problem to design around.

       Sign-up is deliberately absent. Accounts are provisioned by the
       commissioner; see the plan/README. Do not re-add a league selector --
       nothing reads the value Lock used to write (user_metadata.league), while
       the whole app reads user_metadata.metadata.league.
       ========================================================================== -->

  <link rel="icon" type="image/svg+xml" href="https://campusclash.io/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="https://campusclash.io/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="https://campusclash.io/images/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://campusclash.io/images/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---- Design tokens (mirrored from public/styles.css :root) ------------ */
    :root {
      --cc-bg:          #101322;
      --cc-surface:     #1A1F33;
      --cc-border:      #2A2E42;
      --cc-border-2:    #3A3F58;
      --cc-text:        #F4F6FB;
      --cc-muted:       #A4A9C2;
      --cc-muted-2:     #8A90A8;
      --cc-accent:      #ed5858;
      --cc-accent-deep: #d94a4a;   /* hover; from the offseason announcement */
      --cc-info:        #6C9BFF;   /* documented focus-ring colour */
      --cc-r-sm:   6px;
      --cc-r-md:  10px;
      --cc-r-lg:  14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--cc-bg);
      color: var(--cc-text);
      font-family: "Poppins", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
    }

    /* ---- Brand panel ------------------------------------------------------ */
    .brand-panel {
      position: relative;
      overflow: hidden;
      background: var(--cc-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 32px 32px;
    }

    /* Primetime wash + yard lines. Lifted from the season-preview hero so the
       two standalone pages share a visual language. */
    .brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(105% 62% at 50% -12%, rgba(237, 88, 88, 0.26), transparent 62%),
        repeating-linear-gradient(90deg,
          transparent 0, transparent 78px,
          rgba(244, 246, 251, 0.07) 78px, rgba(244, 246, 251, 0.07) 80px);
      pointer-events: none;
    }

    .crest-wrap { position: relative; display: block; line-height: 0; }

    .crest {
      position: relative;
      display: block;
      width: min(46vh, 340px);
      max-width: 100%;
      height: auto;
      z-index: 1;
    }

    /* One-shot ring pulse behind the crest (the draft-room hero idiom). */
    .crest-wrap::after {
      content: "";
      position: absolute;
      left: 50%; top: 52%;
      width: 78%; aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(237, 88, 88, 0.5);
      opacity: 0;
      pointer-events: none;
    }

    .brand-tagline {
      position: relative;
      z-index: 1;
      max-width: 26ch;
      margin: 0;
      text-align: center;
      text-wrap: balance;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--cc-muted);
    }
    .brand-tagline b { color: var(--cc-text); font-weight: 600; }

    /* ---- Form panel ------------------------------------------------------- */
    .form-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 24px 56px;
      background: var(--cc-bg);
    }

    /* Flex column so invite mode can reorder the blocks with `order` instead of
       moving DOM nodes. Same markup either way — a returning member sees exactly
       what they saw before. */
    .form-inner { width: 100%; max-width: 380px; display: flex; flex-direction: column; }
    .m-brand   { order: 0; }
    #eyebrow   { order: 1; }
    #headline  { order: 2; }
    #subhead   { order: 3; }
    #login-form{ order: 4; }
    #reset-row { order: 5; }
    #divider   { order: 6; }
    #social    { order: 7; }
    #footnote  { order: 8; }

    /* ---- Invite mode ------------------------------------------------------
       Set when the authorize request carried ext-invite=1 (see the script). The
       visitor was sent a link and has no account yet, so email+password cannot
       work for them: sign-ups are disabled on the database connection and this
       page has no sign-up form. Leading with it would hand them a dead end —
       type an address, invent a password, get "that email and password don't
       match". Apple and Google are the only paths that can succeed, so they go
       first and the password block is demoted to what it actually is here: the
       door for someone who already has one. */
    body.is-invite #social    { order: 4; }
    body.is-invite #divider   { order: 5; }
    body.is-invite #login-form{ order: 6; }
    body.is-invite #reset-row { order: 7; }
    body.is-invite #footnote  { display: none; }
    body.is-invite #social    { margin-bottom: 4px; }
    body.is-invite #divider   { margin: 24px 0 18px; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--cc-accent);
    }
    .eyebrow::before {
      content: "";
      width: 34px; height: 2px;
      background: var(--cc-accent);
      flex: none;
    }

    h1 {
      margin: 0 0 10px;
      font-family: Graduate, serif;
      font-weight: 400;
      font-size: clamp(2.1rem, 4.4vw, 2.8rem);
      line-height: 0.95;
      text-transform: uppercase;
    }

    .subhead {
      margin: 0 0 24px;
      font-size: 0.95rem;
      color: var(--cc-muted);
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    .field label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cc-muted);
    }

    .field input {
      background: var(--cc-surface);
      border: 1px solid var(--cc-border-2);
      border-radius: var(--cc-r-md);
      padding: 12px 14px;
      color: var(--cc-text);
      font: inherit;
      font-size: 0.95rem;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field input::placeholder { color: var(--cc-muted-2); }
    .field input:focus {
      outline: none;
      border-color: var(--cc-info);
      box-shadow: 0 0 0 3px rgba(108, 155, 255, 0.22);
    }

    /* Error region. Always in the DOM so aria-live announces changes; it just
       has nothing to say until something goes wrong. */
    .form-error {
      min-height: 0;
      margin: 0 0 14px;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--cc-accent);
    }
    .form-error:empty { margin: 0; }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 13px 20px;
      border: 0;
      border-radius: var(--cc-r-md);
      background: var(--cc-accent);
      color: #fff;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(237, 88, 88, 0.4), 0 12px 34px -10px rgba(237, 88, 88, 0.45);
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--cc-accent-deep);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(237, 88, 88, 0.5), 0 18px 42px -10px rgba(237, 88, 88, 0.5);
    }
    .btn-primary:disabled { opacity: 0.65; cursor: default; transform: none; }

    :focus-visible { outline: 2px solid var(--cc-info); outline-offset: 2px; }

    /* Spinner shown while a sign-in is in flight. */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .link-row { margin: 14px 0 0; text-align: center; }

    .link {
      background: none;
      border: 0;
      padding: 4px 6px;
      font: inherit;
      font-size: 0.85rem;
      color: var(--cc-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      border-radius: var(--cc-r-sm);
    }
    .link:hover { color: var(--cc-text); }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0 16px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cc-muted-2);
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--cc-border);
    }

    /* ---- Social ----------------------------------------------------------- */
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      margin-bottom: 10px;
      padding: 12px 18px;
      border-radius: var(--cc-r-md);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .btn-social svg { flex: none; }
    .btn-social:disabled { opacity: 0.65; cursor: default; }

    /* Apple's outlined dark variant -- a bare black fill has no edge on navy. */
    .btn-apple { background: #000; border: 1px solid rgba(244, 246, 251, 0.28); }
    .btn-apple:hover:not(:disabled) { border-color: rgba(244, 246, 251, 0.5); }

    /* Google's sanctioned dark button. */
    .btn-google { background: #131314; border: 1px solid #8E918F; }
    .btn-google:hover:not(:disabled) { background: #1c1c1d; }

    .footnote {
      margin: 22px 0 0;
      text-align: center;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--cc-muted-2);
    }

    /* ---- Mobile wordmark (crest is desktop-only; see below) ----------------
       Ported verbatim from the navbar mark in public/styles.css, which this
       page can't link (see the head comment). KEEP THE TWO IN SYNC -- if the
       mark is retuned there, retune it here. Every metric is em-relative off
       --brand-size, so that is the only knob. --brand-ground is the colour the
       keyline punches through CAMPUS, so it has to match what the mark actually
       sits on: here that is the form panel's --cc-bg. */
    .m-brand { display: none; text-align: center; margin: 0 0 26px; }

    .brand-title {
      --brand-size: 2.4rem;
      --brand-ground: var(--cc-bg);
      font-size: var(--brand-size);
      line-height: 1;              /* Pacifico's default line box is ~1.5x */
      display: inline-grid;
      justify-items: center;
    }

    .brand-campus {
      font-family: Graduate, serif;
      font-size: .62em;
      letter-spacing: .10em;
      text-indent: .10em;          /* cancel the trailing letter-space to centre true */
    }

    .brand-clash {
      font-family: Pacifico, cursive;
      font-size: 1.1em;            /* larger script into smaller caps reads as impact */
      margin-top: -.18em;          /* THE clash; resolves against this element's 1.1em */
      margin-left: -.04em;         /* Pacifico enters left-heavy */
      color: var(--cc-accent);
      position: relative;
      z-index: 1;                  /* script passes in front of the caps */
      text-shadow:
        .052em 0 var(--brand-ground), -.052em 0 var(--brand-ground),
        0 .052em var(--brand-ground), 0 -.052em var(--brand-ground),
        .037em .037em var(--brand-ground), -.037em .037em var(--brand-ground),
        .037em -.037em var(--brand-ground), -.037em -.037em var(--brand-ground);
    }

    /* ---- Layout: split at the app's 64em breakpoint ------------------------ */
    @media (min-width: 64em) {
      .shell { grid-template-columns: 55fr 45fr; }
      .form-panel { padding: 40px 48px; justify-content: flex-start; }
      .form-inner { max-width: 400px; }
    }

    /* Below the split, the crest would push the form under the fold, so the
       panel collapses to the CSS wordmark the rest of the app uses. */
    @media (max-width: 63.99em) {
      .brand-panel { display: none; }
      .m-brand { display: block; }
      .form-panel {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        padding-top: 56px;
      }
      .form-panel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 340px;
        background:
          radial-gradient(120% 100% at 50% -30%, rgba(237, 88, 88, 0.15), transparent 62%),
          repeating-linear-gradient(90deg,
            transparent 0, transparent 78px,
            rgba(244, 246, 251, 0.05) 78px, rgba(244, 246, 251, 0.05) 80px);
        pointer-events: none;
      }
      .form-inner { position: relative; z-index: 1; }
    }

    /* ---- Motion ----------------------------------------------------------- */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes crest-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes ring-pulse {
        0%   { transform: translate(-50%, -50%) scale(0.9); opacity: 0.65; }
        100% { transform: translate(-50%, -50%) scale(1.35); opacity: 0; }
      }
      @keyframes brand-draw { to { clip-path: inset(0 0 0 0); } }

      .crest { animation: crest-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .crest-wrap::after { animation: ring-pulse 1.5s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s 1 both; }

      .anim { opacity: 0; animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
      .d1 { animation-delay: 0.05s; }
      .d2 { animation-delay: 0.16s; }
      .d3 { animation-delay: 0.28s; }
      .d4 { animation-delay: 0.40s; }

      /* Same staggered wipe as the app navbar wordmark (styles.css). */
      .brand-title > div { clip-path: inset(0 100% 0 0); animation: brand-draw 0.7s cubic-bezier(0.4, 0, 0.2, 1) both; }
      .brand-title > div:nth-child(1) { animation-delay: 0.05s; }
      .brand-title > div:nth-child(2) { animation-delay: 0.32s; }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="brand-panel">
      <span class="crest-wrap">
        <img class="crest" src="https://campusclash.io/images/campus-clash-badge-720.webp"
             alt="Campus Clash" width="720" height="994" />
      </span>
      <p class="brand-tagline">Draft <b>programs</b>, not players. Every Saturday counts.</p>
    </section>

    <section class="form-panel">
      <div class="form-inner">
        <div class="m-brand">
          <div class="brand-title">
            <div class="brand-campus">CAMPUS</div>
            <div class="brand-clash">Clash</div>
          </div>
        </div>

        <p class="eyebrow anim d1" id="eyebrow">Est. 2023 &middot; Members only</p>
        <h1 class="anim d1" id="headline">Take the field</h1>
        <p class="subhead anim d2" id="subhead">Sign in to your franchise.</p>

        <form id="login-form" class="anim d3" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email"
                   autocapitalize="off" autocorrect="off" spellcheck="false"
                   placeholder="yours@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Your password" required />
          </div>

          <p class="form-error" id="error" role="alert" aria-live="polite"></p>

          <button class="btn-primary" id="submit" type="submit">
            <span id="submit-label">Sign in</span>
            <span id="submit-chevron" aria-hidden="true">&rsaquo;</span>
          </button>
        </form>

        <p class="link-row anim d3" id="reset-row">
          <button class="link" id="reset" type="button">Forgot your password?</button>
        </p>

        <div class="divider anim d4" id="divider">or</div>

        <div class="anim d4" id="social">
          <button class="btn-social btn-apple" type="button" data-connection="apple">
            <svg width="17" height="17" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            Continue with Apple
          </button>

          <button class="btn-social btn-google" type="button" data-connection="google-oauth2">
            <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>
        </div>

        <p class="footnote anim d4" id="footnote">New here? Ask your commissioner for an invite link.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.auth0.com/js/auth0/9.23.3/auth0.min.js"></script>
  <script>
    // Decode utf8 characters properly
    var config = JSON.parse(decodeURIComponent(escape(window.atob('@@config@@'))));
    config.extraParams = config.extraParams || {};
    config.internalOptions = config.internalOptions || {};

    // The database connection to authenticate against. config.connection is set
    // when the authorize request pinned one; otherwise fall back to the tenant
    // default. Must match the connection name in Auth0 exactly.
    var DB_CONNECTION = config.connection || 'Username-Password-Authentication';

    // config.internalOptions carries the per-request values Auth0 minted for
    // THIS authorize call -- state, nonce, scope, audience, response_type. They
    // have to be spread onto the constructor options: drop them and the code
    // that comes back fails state/nonce validation at /callback, so every login
    // dead-ends even though the form itself looks fine. Lock passed the same
    // object through as auth.params. Assigned last so it wins.
    var webAuth = new auth0.WebAuth(Object.assign({
      domain: config.auth0Domain,
      clientID: config.clientID,
      redirectUri: config.callbackURL,
      responseType: config.callbackOnLocationHash ? 'token' : 'code',
      overrides: {
        __tenant: config.auth0Tenant,
        __token_issuer: config.authorizationServer.issuer
      }
    }, config.internalOptions));

    var form = document.getElementById('login-form');
    var emailEl = document.getElementById('email');
    var passwordEl = document.getElementById('password');
    var errorEl = document.getElementById('error');
    var submitEl = document.getElementById('submit');
    var labelEl = document.getElementById('submit-label');
    var chevronEl = document.getElementById('submit-chevron');
    var socialEls = [].slice.call(document.querySelectorAll('.btn-social'));

    // Prefill from ?login_hint=, the way Lock did.
    if (config.extraParams.login_hint) {
      emailEl.value = config.extraParams.login_hint;
    }

    // Invite mode. Auth0 passes `ext-`-prefixed authorize parameters through to
    // this page in extraParams, which is how a page hosted on the tenant learns
    // anything about where the visitor came from. server.js sets it when someone
    // starts from an invite link. If Auth0 ever stops forwarding it the page
    // simply renders as normal — the flag is an enhancement, never a gate.
    if (String(config.extraParams['ext-invite'] || '') === '1') {
      document.body.classList.add('is-invite');
      document.getElementById('eyebrow').textContent = 'Invited · One more step';
      // Short enough to hold one line at the same size as "Take the field";
      // the subhead does the instructing.
      document.getElementById('headline').textContent = 'Almost there';
      document.getElementById('subhead').textContent =
        'Pick how you want to sign in from now on. We’ll connect it to your team.';
      document.getElementById('divider').textContent = 'or use a password';
      // Not "Forgot your password?" — they don't have one yet, and offering a
      // reset for an account that doesn't exist is its own dead end.
      document.getElementById('reset-row').style.display = 'none';
      document.title = 'Finish setting up — Campus Clash';
    }

    // Auth0 error code -> what a league member should actually read. Never say
    // which of the two fields was wrong.
    function messageFor(err) {
      var code = (err && (err.code || err.error)) || '';
      var description = (err && (err.description || err.error_description)) || '';
      switch (code) {
        case 'invalid_user_password':
        case 'access_denied':
          return 'That email and password don’t match.';
        case 'too_many_attempts':
        case 'too_many_logins':
          return 'Too many attempts. Take a knee and try again in a few minutes.';
        case 'unauthorized':
        case 'blocked_user':
          return 'This account is blocked. Reach out to your commissioner.';
        case 'password_leaked':
          return 'This password showed up in a breach. Check your email for a reset link.';
        case 'invalid_captcha':
          return 'Couldn’t verify that you’re human. Reload the page and try again.';
        case 'requires_verification':
          return 'Check your email to verify this address, then sign in again.';
        default:
          // Surface Auth0's own wording when it gave us something readable,
          // rather than swallowing a real explanation behind a generic string.
          return description || 'Something went wrong on our end. Try again.';
      }
    }

    function setError(msg) {
      errorEl.style.color = '';           // undo any setNotice() recolour
      errorEl.textContent = msg || '';
    }

    // Same region, neutral colour -- for outcomes that aren't failures.
    function setNotice(msg) {
      errorEl.style.color = 'var(--cc-muted)';
      errorEl.textContent = msg;
    }

    function setBusy(busy, label) {
      submitEl.disabled = busy;
      socialEls.forEach(function (b) { b.disabled = busy; });
      labelEl.textContent = busy ? (label || 'Checking the roster…') : 'Sign in';
      chevronEl.innerHTML = busy ? '' : '&rsaquo;';
      chevronEl.className = busy ? 'spinner' : '';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      setError('');

      var email = emailEl.value.trim();
      var password = passwordEl.value;

      if (!email || !password) {
        setError('Enter your email and password.');
        (email ? passwordEl : emailEl).focus();
        return;
      }

      setBusy(true);
      webAuth.login({
        realm: DB_CONNECTION,
        username: email,
        password: password
      }, function (err) {
        // Success redirects, so reaching this callback at all means failure.
        setBusy(false);
        setError(messageFor(err));
        passwordEl.focus();
        passwordEl.select();
      });
    });

    socialEls.forEach(function (btn) {
      btn.addEventListener('click', function () {
        setError('');
        setBusy(true, 'Redirecting…');
        webAuth.authorize({ connection: btn.getAttribute('data-connection') });
      });
    });

    document.getElementById('reset').addEventListener('click', function () {
      var email = emailEl.value.trim();
      if (!email) {
        setError('Enter your email above first, then tap reset.');
        emailEl.focus();
        return;
      }
      setError('');
      setBusy(true, 'Sending…');
      webAuth.changePassword({
        connection: DB_CONNECTION,
        email: email
      }, function (err) {
        setBusy(false);
        if (err) {
          setError(messageFor(err));
          return;
        }
        // Deliberately does not confirm whether the address exists.
        setNotice('If that email has an account, a reset link is on its way.');
      });
    });
  </script>
</body>

</html>
